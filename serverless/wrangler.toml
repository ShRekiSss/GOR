name = "vaksa-api"
main = "src/index.ts"
compatibility_date = "2026-09-30"

# Публичные домены: Worker со статикой и API на одном адресе.
# Основной + запасные входы (зеркала): если провайдер режет один хост,
# пользователь открывает другой — это тот же Worker, та же D1, тот же WS.
routes = [
  { pattern = "vaksa.space", custom_domain = true },
  { pattern = "www.vaksa.space", custom_domain = true },
  { pattern = "m.vaksa.space", custom_domain = true },
  { pattern = "app.vaksa.space", custom_domain = true },
  { pattern = "chat.vaksa.space", custom_domain = true },
]

# CORS: разрешаем переключение API между зеркалами (Bearer-токен, без cookie).
[vars]
ORIGINS = "https://vaksa.space,https://www.vaksa.space,https://m.vaksa.space,https://app.vaksa.space,https://chat.vaksa.space"

# Облачная БД (замена chat.db); файлы — чанками в самой D1 (см. file_chunks).
[[d1_databases]]
binding = "DB"
database_name = "vaksa-db"
database_id = "f8e84117-7c31-4577-8ec8-2e546d4ecf3c"

# Durable Objects: хаб WS-соединений + лимитер попыток входа.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "LIMIT"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub", "Limiter"]

# Статика PWA — из того же домена, бесплатно и с CDN.
[assets]
directory = "../frontend/build"
not_found_handling = "single-page-application"
binding = "ASSETS"
