services:
  gor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: "0.9.1"
    container_name: gor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # наружу — только через Caddy/Cloudflare Tunnel
    environment:
      GOR_PORT: "8080"
      GOR_DB: /data/chat.db
      GOR_UPLOADS: /data/uploads
      GOR_STATIC: /app/frontend/build
      # GOR_ORIGINS: "https://chat.example.com"  # ограничить Origin для WS
      # GOR_GIPHY_KEY: "ваш_ключ_giphy"          # поиск GIF через /api/giphy
      TZ: Europe/Moscow
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
