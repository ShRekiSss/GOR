# Cloudflare Tunnel — если нет публичного IP (домашний ПК/роутер за NAT).
#
# 1. Установите cloudflared:
#      https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/
# 2. cloudflared tunnel login
# 3. cloudflared tunnel create gor
# 4. Скопируйте этот файл в ~/.cloudflared/config.yml, подставьте tunnel ID,
#    путь к json-ключу и домен.
# 5. cloudflared tunnel route dns gor chat.example.com
# 6. sudo cloudflared service install

tunnel: <TUNNEL_ID>
credentials-file: /root/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: chat.example.com
    service: http://127.0.0.1:8080
    originRequest:
      # WebSocket не должен обрываться прокси
      noTLSVerify: false
      connectTimeout: 30s
  - service: http_status:404
