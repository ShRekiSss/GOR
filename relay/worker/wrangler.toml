# Релей VAKSA: публичный вход на домен через Cloudflare Worker + Durable Object.
# Секрет RELAY_KEY ставится отдельно: wrangler secret put RELAY_KEY
name = "vaksa-relay"
main = "src/index.ts"
compatibility_date = "2026-09-30"

routes = [
  { pattern = "vaksa.space", custom_domain = true },
]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
