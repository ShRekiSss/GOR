name: android-debug
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          set -e
          SDK="$ANDROID_HOME"
          sudo "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" >/dev/null
          yes | sudo "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - name: Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install -g npm@11 >/dev/null 2>&1
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Tauri android build (как в build.yml)
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-user-home"
          sudo mkdir -p "$HOME/.config/.android" "$ANDROID_HOME/.android"
          sudo chmod -R a+rwX "$HOME/.config/.android" "$ANDROID_HOME/.android" 2>/dev/null || true
          npx tauri android init --ci
          bash patch-android-permissions.sh
          printf '\norg.gradle.configuration-cache=false\n' >> src-tauri/gen/android/gradle.properties
          npx tauri android build --ci --apk --debug || true

      - name: Collect gradle stacktrace (или APK если собралось)
        if: always()
        working-directory: desktop/src-tauri/gen/android
        run: |
          ls -ld "$HOME/.android" "$HOME/.config/.android" "$ANDROID_HOME/.android" 2>&1 | tee -a "$GITHUB_WORKSPACE/diag-env.log" || true
          ls -l tauri.settings.gradle settings.gradle 2>&1 | tee -a "$GITHUB_WORKSPACE/diag-env.log" || true
          (./gradlew :app:assembleUniversalDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-diag.log") || true
          grep -nE "Caused by" "$GITHUB_WORKSPACE/gradle-diag.log" | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-diag
          path: |
            gradle-diag.log
            diag-env.log
          if-no-files-found: warn

      - name: Поднять APK если собрался
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-apk
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/universal/*.apk
          if-no-files-found: ignore
